name: Stock & News Briefing Bot

on:
  schedule:
   
    # 매일
    - cron: '30 21 * * *'

  # 수동 실행 버튼 활성화
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: 깃허브 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정 및 pip 캐싱
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 👈 pip 패키지 캐싱 적용

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 브리핑 봇 실행
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python main.py
