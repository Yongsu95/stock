name: Stock Briefing Agent

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests yfinance urllib3

      - name: Run briefing script
        env:
          REST_API_KEY: ${{ secrets.REST_API_KEY }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
        run: |
          python main.py
